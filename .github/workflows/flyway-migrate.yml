# CI/CD — Migración de esquema con Flyway
#
# Comportamiento:
#   Pull request → main  : flyway validate + flyway migrate contra DEV
#   Push a main          : flyway migrate contra PROD
#   workflow_dispatch    : ejecución manual con elección de entorno
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   FLYWAY_URL_DEV        jdbc:postgresql://<host>/<db>?sslmode=require
#   FLYWAY_USER_DEV
#   FLYWAY_PASSWORD_DEV
#   FLYWAY_URL_PROD       jdbc:postgresql://<host>/<db>?sslmode=require
#   FLYWAY_USER_PROD
#   FLYWAY_PASSWORD_PROD

name: Flyway Migrate

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/flyway-migrate.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/flyway-migrate.yml'
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno destino'
        required: true
        type: choice
        default: dev
        options: [dev, prod]

concurrency:
  group: flyway-${{ github.ref }}
  cancel-in-progress: false

env:
  FLYWAY_VERSION: '10.20.1'
  MIGRATIONS_DIR: migrations

jobs:
  migrate:
    name: Aplicar migraciones (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar entorno destino
        id: entorno
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            destino="${{ inputs.entorno }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            destino="prod"
          else
            destino="dev"
          fi
          echo "destino=${destino}" >> "$GITHUB_OUTPUT"
          echo "Entorno: ${destino}"

      - name: Instalar Flyway CLI
        run: |
          curl -fsSL \
            "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            -o flyway.tar.gz
          tar -xzf flyway.tar.gz
          echo "${GITHUB_WORKSPACE}/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: Verificar instalación
        run: flyway --version

      - name: Flyway validate
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: |
          flyway validate \
            -locations="filesystem:${MIGRATIONS_DIR}" \
            -validateMigrationNaming=true \
            -ignoreMigrationPatterns='*:pending'

      - name: Flyway info (estado previo)
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: flyway info -locations="filesystem:${MIGRATIONS_DIR}"

      - name: Flyway migrate
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: |
          flyway migrate \
            -locations="filesystem:${MIGRATIONS_DIR}" \
            -outOfOrder=false \
            -cleanDisabled=true

      - name: Flyway info (estado final)
        if: always()
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: flyway info -locations="filesystem:${MIGRATIONS_DIR}"

      - name: Resumen del run
        if: always()
        run: |
          {
            echo "## Flyway — resultado"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Entorno | \`${{ steps.entorno.outputs.destino }}\` |"
            echo "| Evento  | \`${{ github.event_name }}\` |"
            echo "| Commit  | \`${{ github.sha }}\` |"
            echo "| Estado  | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
